spring.application.name=ai-integration-api
server.port=${SERVER_PORT:8080}

# Load local secrets from a git-ignored .env file in the working directory, if present.
# Real environment variables still take precedence over values in .env.
spring.config.import=optional:file:.env[.properties]

# --- Provider selection ---
# Used by /api/ask and /api/ask/rag when a request has no "provider": claude or gemini.
app.default-provider=${DEFAULT_PROVIDER:claude}

# --- Anthropic / Claude API configuration ---
# ANTHROPIC_API_KEY must be supplied as an environment variable.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-4-8}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:2048}

# --- Google Gemini API configuration ---
# GEMINI_API_KEY must be supplied as an environment variable to use provider "gemini".
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.max-tokens=${GEMINI_MAX_TOKENS:2048}

# --- PostgreSQL (product data for the RAG endpoint) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secret}
# Run schema.sql + data.sql on every startup (both are idempotent).
spring.sql.init.mode=always

# --- JWT configuration ---
# NOTE: this is a simple hardcoded secret for local testing/demo purposes only.
# In production, supply JWT_SECRET via environment variable / secrets manager
# and never commit a real signing key to source control.
jwt.secret=${JWT_SECRET:this-is-a-hardcoded-test-secret-key-for-dev-only-change-me-32bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Actuator (health check only) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Logging ---
logging.level.com.example.claudeintegration=INFO
