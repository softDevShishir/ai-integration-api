services:
  claude-integration-api:
    build: .
    image: claude-integration-api:latest
    container_name: claude-integration-api
    ports:
      - "8080:8080"
    # Pass every variable from the local, git-ignored .env file into the container.
    # Values under `environment:` below take precedence (they also read .env, with defaults).
    env_file:
      - .env
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2048}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-2048}
      JWT_SECRET: ${JWT_SECRET:-this-is-a-hardcoded-test-secret-key-for-dev-only-change-me-32bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SERVER_PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
