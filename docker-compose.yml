services:
  postgres:
    image: postgres:16
    container_name: ai-integration-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Host port for this database, so `mvn spring-boot:run` on the host can use it too.
      # Set DB_HOST_PORT (and the port in DB_URL) if 5432 is already taken on your machine.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-integration-api:
    build: .
    image: ai-integration-api:latest
    container_name: ai-integration-api
    ports:
      - "8080:8080"
    # Pass every variable from the local, git-ignored .env file into the container.
    # Values under `environment:` below take precedence (they also read .env, with defaults).
    env_file:
      - .env
    environment:
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2048}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-2048}
      JWT_SECRET: ${JWT_SECRET:-this-is-a-hardcoded-test-secret-key-for-dev-only-change-me-32bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # Inside the compose network the database host is the `postgres` service, not localhost,
      # so DB_URL is fixed here rather than taken from .env.
      DB_URL: jdbc:postgresql://postgres:5432/shop
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
